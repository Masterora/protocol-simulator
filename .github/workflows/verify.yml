name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run test:ui
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: go test ./... -count=1 -timeout=120s
      - run: go vet ./...
      - if: runner.os == 'macOS'
        run: go test -race ./internal/core -count=1 -timeout=120s
      - if: runner.os == 'Windows'
        run: go build -tags desktop,production -ldflags "-H windowsgui" -o build/bin/protocol-simulator.exe .
