name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install nsis sevenzip
      - run: bash build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: outputs/protocol-simulator.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: nsis-dev/setup-nsis@99783963764acafc24a5e3335ddfce26d03c20a2
        with:
          version: '3.13'
      - run: npm ci
      - name: Build and verify Windows installer
        shell: pwsh
        run: |
          try { ./build.ps1 } catch {
            Get-ChildItem verification -Filter *.txt | ForEach-Object {
              Write-Host $_.Name
              Get-Content $_.FullName -Tail 40
            }
            throw
          }
          python scripts/package_protocol.py
          if ($LASTEXITCODE) { throw 'Windows packaging failed' }
          ./tests/windows_installer_smoke.ps1 -Setup outputs/protocol-simulator-Setup.exe -Application build/bin/protocol-simulator.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: outputs/protocol-simulator-Setup.exe
          if-no-files-found: error

  linux-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_linux_server.py
      - name: Verify native server and systemd
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p work/server-native
          tar -xzf "outputs/protocol-simulator-server-linux-$ARCH.tar.gz" -C work/server-native
          sudo python3 scripts/verify_linux_server.py --binary work/server-native/protocol-simulator-server/bin/prs --output verification/linux-server-runtime --systemd
          python3 scripts/verify_tui_posix.py --binary work/server-native/protocol-simulator-server/bin/prs --output verification/tui-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: linux-server-${{ matrix.arch }}
          path: outputs/protocol-simulator-server-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  linux-desktop:
    needs: linux-server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev dpkg-dev librsvg2-common hicolor-icon-theme xvfb dbus-x11 xdotool x11-utils fonts-noto-cjk
      - run: python3 scripts/build_linux_desktop.py
      - run: go test -c -tags desktop,production,webkit2_41 -o /tmp/protocol-native.test .
      - name: Verify native desktop install, windows and uninstall
        env:
          ARCH: ${{ matrix.arch }}
        run: sudo python3 scripts/verify_linux_desktop.py --package "outputs/protocol-simulator-desktop-linux-$ARCH.deb" --smoke-binary /tmp/protocol-native.test --output verification/linux-desktop-runtime --user "$USER"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-desktop-${{ matrix.arch }}
          path: outputs/protocol-simulator-desktop-linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  publish:
    needs: [macos, windows, linux-server, linux-desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: outputs
          merge-multiple: true
      - name: Verify complete bundle and release version
        env:
          SOURCE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          version = json.loads(Path('wails.json').read_text(encoding='utf-8'))['info']['productVersion']
          tag = 'v' + version
          assert not os.environ['SOURCE_TAG'] or os.environ['SOURCE_TAG'] == tag, 'Tag must match wails.json'
          expected = {'protocol-simulator.dmg', 'protocol-simulator-Setup.exe'}
          for arch in ('amd64', 'arm64'):
              expected.add(f'protocol-simulator-server-linux-{arch}.tar.gz')
              expected.add(f'protocol-simulator-desktop-linux-{arch}.deb')
          actual = {p.name for p in Path('outputs').iterdir()}
          assert actual == expected, f'Unexpected release files: {actual ^ expected}'
          checksums = [f'{hashlib.sha256((Path("outputs") / name).read_bytes()).hexdigest()}  {name}' for name in sorted(expected)]
          Path('outputs/SHA256SUMS').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'RELEASE_TAG={tag}\n')
          PY
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" outputs/* --target "$GITHUB_SHA" --draft --title "protocol-simulator $RELEASE_TAG" --notes 'macOS 通用 DMG、Windows x64 Setup、Linux amd64/arm64 桌面 DEB 和服务器压缩包。下载对应安装包；SHA256SUMS 用于校验文件。macOS 使用本地签名，Linux 桌面适用于 Ubuntu 24.04/X11。'
          gh release download "$RELEASE_TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
          gh release edit "$RELEASE_TAG" --draft=false --latest
